name: Release readiness
run-name: ${{ inputs.mode == 'inspect' && 'line' || inputs.mode == 'dependencies' && 'dependencies' || inputs.mode == 'history' && 'history' || 'publication' }} / ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      mode: { type: choice, options: [check, inspect, dependencies, history], default: check, required: false }
      request_id: { type: string, required: true }
      generation: { type: string, required: true }
      product_version: { type: string, required: true }
      expected_checker_sha: { type: string, required: true }
      target_tag: { type: string, required: false, default: '' }        # mode=check
      target_sha: { type: string, required: false, default: '' }        # mode=check
      target_version: { type: string, required: false, default: '' }    # mode=check
      line_version: { type: string, required: false, default: '' }      # mode=inspect, mode=dependencies, mode=history
      expected_head_sha: { type: string, required: false, default: '' } # mode=inspect, mode=dependencies, mode=history
      compare_refs: { type: string, required: false, default: '' }      # mode=history: `<branch>@<sha>` per line

permissions:
  contents: read
  packages: read
concurrency:
  group: ${{ inputs.mode == 'inspect' && 'line' || inputs.mode == 'dependencies' && 'dependencies' || inputs.mode == 'history' && 'history' || 'publication' }}-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  publication:
    uses: arenadata/adrm-checks/.github/workflows/publication-readiness.yml@2342bc825d74fa179f9f0e894d838d57258e8dd6
    with:
      mode: ${{ inputs.mode }}
      request_id: ${{ inputs.request_id }}
      generation: ${{ inputs.generation }}
      product_version: ${{ inputs.product_version }}
      expected_checker_sha: ${{ inputs.expected_checker_sha }}
      target_tag: ${{ inputs.target_tag }}
      target_sha: ${{ inputs.target_sha }}
      target_version: ${{ inputs.target_version }}
      line_version: ${{ inputs.line_version }}
      expected_head_sha: ${{ inputs.expected_head_sha }}
      compare_refs: ${{ inputs.compare_refs }}
      # mode=dependencies: static values of this project, copied from its publisher workflow (flags and profiles
      # only, no goals or tasks). Maven: the publisher's JDK (JDK-activated profiles change the graph). Gradle: the
      # highest JDK the publisher uses. The build runs in eclipse-temurin:<java_version>-jdk (java_distribution:
      # temurin only). maven_server_ids: the ids of the repositories the build reads from GitHub Packages; they get the
      # workflow token and resolve from https://maven.pkg.github.com/<owner>/*. maven_mirrors (`<id> <https url>` per
      # line) points other ids at one registry, for an id that names two hosts across the modules.
      build_tool: maven
      build_command: mvn
      java_version: '11'
      java_distribution: temurin
      maven_server_ids: arenadata
      build_args: |
        -DskipTests=true -Dcheckstyle.skip=true -Djacoco.skip=true -Dpmd.skip=true -Drat.skip=true -Dspotbugs.skip=true -Denunciate.skip=true
      # mode=history: the upstream repository whose release tags bound the comparison (default: the root of the fork
      # network, e.g. apache/hadoop for arenadata/hadoop) and paths that differ between line branches by design
      # (.github/ and .readiness/ always do). Set them only when the defaults are wrong.
