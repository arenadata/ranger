# Regenerates .readiness/publication.yaml for ADRM by running the publisher exactly as the deploy step of
# publish.yml does, with deployment redirected into a sandbox directory by arenadata/adrm-checks. Run it by hand
# to refresh the manifest (the pull-request job opens a pull request when the module/file set changed); on pull
# requests that touch the build it fails when the manifest is stale.
name: Publication manifest
on:
  workflow_dispatch:
  pull_request:
    paths: ['**/pom.xml', '.github/workflows/publish.yml', '.readiness/publication.yaml']

permissions:
  contents: read

env:
  MAVEN_ARGS: -B -V -e -ntp -DskipTests=true -Dcheckstyle.skip=true -Djacoco.skip=true -Dpmd.skip=true -Drat.skip=true -Dspotbugs.skip=true -Denunciate.skip=true

jobs:
  manifest:
    # The bot's own manifest pull request was just produced by this workflow: do not rebuild to re-check it.
    if: github.event_name != 'pull_request' || github.head_ref != 'readiness/publication-manifest'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    outputs:
      changed: ${{ steps.manifest.outputs.changed }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Setup JDK 11
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: 11
        server-id: arenadata
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN

    - name: Redirect the publisher to a sandbox
      id: sandbox
      uses: arenadata/adrm-checks/actions/sandbox@2342bc825d74fa179f9f0e894d838d57258e8dd6
      with:
        tool: maven
        deploy-plugin-major: '2'   # maven-deploy-plugin 2.8.2 via the parent org.apache:apache:20

    - name: Run the publisher exactly as publish.yml does
      run: mvn ${{ env.MAVEN_ARGS }} --batch-mode deploy
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate the manifest from the sandbox
      id: manifest
      uses: arenadata/adrm-checks/actions/manifest@2342bc825d74fa179f9f0e894d838d57258e8dd6
      with:
        sandbox: ${{ steps.sandbox.outputs.dir }}
        invocations: '1'

    - name: Hand the manifest over to the pull-request job
      if: steps.manifest.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: publication-manifest
        path: .readiness/publication.yaml
        if-no-files-found: error
        retention-days: 1

    - name: Fail the pull request check when the manifest is stale
      if: steps.manifest.outputs.changed == 'true' && github.event_name == 'pull_request'
      run: |
        git --no-pager diff -- .readiness/publication.yaml
        echo "::error::.readiness/publication.yaml is stale; run the Publication manifest workflow"; exit 1

  pull-request:
    # Commits the manifest artifact of the manifest job and opens the pull request.
    needs: manifest
    if: needs.manifest.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Take the manifest of the manifest job
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: publication-manifest
        path: .readiness

    - name: Open a pull request when the module/file set changed
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        # Commit only the manifest
        add-paths: .readiness/publication.yaml
        branch: readiness/publication-manifest
        title: 'readiness: refresh publication manifest'
        commit-message: 'readiness: refresh publication manifest from the publisher sandbox'
        body: 'The module/file set produced by the publisher differs from .readiness/publication.yaml. Review the diff: added entries are new publications, removed entries are publications that disappeared.'
