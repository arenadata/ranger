name: Publish package to GitHub Packages
on:
  release:
    types: [created]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Publish package
        run: mvn --batch-mode deploy -Dkafka.version=3.9.1 -Dhadoop.version=3.3.6 -DskipTests=true -Dcheckstyle.skip=true -Djacoco.skip=true -Dpmd.skip=true -Drat.skip=true -Dspotbugskip=true -Denunciate.skip=true -DdistMgmtStagingId=github -DdistMgmtStagingName=github -DdistMgmtStagingUrl=https://maven.pkg.github.com/arenadata/ranger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
